<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pocket identity verification</title><style>body{margin:0;background:#fff;color:#171717;font:16px system-ui,-apple-system,sans-serif}main{max-width:360px;margin:20vh auto;padding:24px}h1{font-size:20px;letter-spacing:-.4px}p{font-size:14px;color:#737373;line-height:1.6}button{position:fixed;right:20px;top:calc(20px + env(safe-area-inset-top));width:44px;height:44px;border:0;border-radius:50%;background:#f5f5f5;color:#171717;font-size:24px;cursor:pointer}a{color:inherit;font-size:14px} @media(prefers-color-scheme:dark){body{background:#111;color:#fff}button{background:#262626;color:#fff}}</style></head><body><button type="button" aria-label="Close">&times;</button><main><h1>Identity verification</h1><p>Coming soon</p><a href="https://app.hashpaylink.com/pocket/profile" hidden>Return to Pocket</a></main><script>const origins=['https://app.hashpaylink.com','https://pocket.hashpaylink.com','http://localhost:5173'];const embedded=window.parent!==window;const notify=message=>origins.forEach(origin=>window.parent.postMessage(message,origin));if(embedded)notify('SmileIdentity::ChildPageReady');else document.querySelector('a').hidden=false;document.querySelector('button').onclick=()=>{if(embedded)notify('SmileIdentity::Close');else window.location.replace('https://app.hashpaylink.com/pocket/profile')};</script></body></html>
