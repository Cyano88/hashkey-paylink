# Render deployment configuration — https://render.com/docs/render-yaml
# One Web Service: serves the Vite frontend AND all /api/* routes via Express.

services:
  - type: web
    name: hashkey-paylink
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && NODE_OPTIONS=--max-old-space-size=4096 npm run build:source
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # ── Frontend (baked in at build time by Vite) ──────────────────────────
      - key: VITE_AUTH_BRIDGE
        value: "hybrid"               # enables Privy-backed public PolyDesk sessions
      - key: VITE_PRIVY_APP_ID
        sync: false                   # browser-visible Privy app id
      - key: VITE_BASE_PAYMASTER_URL
        value: "/api/base-paymaster"   # optional Coinbase/CDP Base paymaster proxy
      - key: VITE_CIRCLE_PAYMASTER_ENABLED
        value: "false"                 # enable only after Circle AA payment path is wired
      - key: VITE_CIRCLE_BUNDLER_URL_BASE
        value: "https://public.pimlico.io/v2/8453/rpc"
      - key: VITE_CIRCLE_BUNDLER_URL_ARB
        value: "https://public.pimlico.io/v2/42161/rpc"
      - key: VITE_CIRCLE_PAYMASTER_V08_BASE
        value: "0x0578cFB241215b77442a541325d6A4E6dFE700Ec"
      - key: VITE_CIRCLE_PAYMASTER_V08_ARB
        value: "0x0578cFB241215b77442a541325d6A4E6dFE700Ec"
      - key: VITE_CLIENT_KEY
        sync: false                   # Circle Modular Wallet public client key
      - key: VITE_CLIENT_URL
        sync: false                   # Circle Modular Wallet client URL
      - key: VITE_CIRCLE_EVM_EMAIL_ENABLED
        value: "true"                 # Base/Arbitrum/Arc Circle User-Controlled SCA payments; Gas Station policy required
      - key: VITE_CIRCLE_USER_WALLET_APP_ID
        sync: false                   # Circle User-Controlled Wallet Web SDK app id
      - key: STREAM_FACTORY_ADDRESS_MAINNET
        sync: false
      - key: VITE_STREAM_FACTORY_ADDRESS_MAINNET
        sync: false
      - key: CHECKPOINT_FACTORY_ADDRESS_MAINNET
        sync: false
      - key: VITE_CHECKPOINT_FACTORY_ADDRESS_MAINNET
        sync: false
      - key: ARC_POA_CONTRACT_MAINNET
        sync: false
      - key: VITE_POA_CONTRACT_MAINNET
        sync: false
      - key: ARENA_ESCROW_FACTORY_ADDRESS_MAINNET
        sync: false                   # Server-side Arena escrow factory after multiplayer contract deploy
      - key: ARENA_RELAYER_PRIVATE_KEY_MAINNET
        sync: false                   # Server-side Arena relayer key; must match deployed Arena factory relayer
      - key: CIRCLE_API_KEY
        sync: false                   # Circle server API key for wallet OTP/signing
      - key: CIRCLE_BASE_URL
        value: "https://api.circle.com"
      - key: PAYCREST_API_BASE
        value: "https://api.paycrest.io"
      - key: PAYCREST_API_KEY
        sync: false                   # Paycrest Sender API key
      - key: PAYCREST_API_SECRET
        sync: false                   # verifies /api/paycrest-webhook signatures
      # Circle Pocket Bills / VTpass Phase 0. Sandbox controls are explicit
      # dashboard settings; live vending and refunds remain hard-disabled.
      - key: VTPASS_ENVIRONMENT
        value: "sandbox"
      - key: VTPASS_API_BASE
        value: "https://sandbox.vtpass.com"
      - key: VTPASS_API_KEY
        sync: false                   # VTpass server-only static API key
      - key: VTPASS_PUBLIC_KEY
        sync: false                   # VTpass server-only GET key
      - key: VTPASS_SECRET_KEY
        sync: false                   # VTpass server-only POST key
      - key: POCKET_BILLS_ENABLED
        sync: false                   # explicitly enable only for the sandbox pilot
      - key: VTPASS_SANDBOX_VENDING_ENABLED
        sync: false                   # explicitly enable only after provider checks pass
      - key: VTPASS_LIVE_VENDING_ENABLED
        value: "false"
      - key: VTPASS_AIRTIME_WHITELIST_CONFIRMED
        sync: false                   # explicit operator acknowledgement
      - key: VTPASS_DATA_WHITELIST_CONFIRMED
        sync: false                   # keep false until Data is separately approved
      - key: VTPASS_TV_WHITELIST_CONFIRMED
        sync: false                   # keep false until TV is separately approved
      - key: VTPASS_ELECTRICITY_WHITELIST_CONFIRMED
        sync: false                   # keep false until Electricity is separately approved
      - key: POCKET_BILLS_REFUNDS_READY
        value: "false"
      - key: CIRCLE_ENTITY_SECRET
        sync: false                   # Circle developer-controlled wallet secret; never expose to the browser
      - key: POCKET_BILLS_TREASURY_WALLET_SET_IDEMPOTENCY_KEY
        sync: false                   # stable UUID v4 used only to make wallet-set creation idempotent
      - key: POCKET_BILLS_TREASURY_WALLET_IDEMPOTENCY_KEY
        sync: false                   # stable UUID v4 used only to make wallet creation idempotent
      - key: POCKET_BILLS_TREASURY_WALLET_SET_ID
        sync: false                   # Circle developer-controlled wallet set
      - key: POCKET_BILLS_TREASURY_WALLET_ID
        sync: false                   # Circle developer-controlled Base SCA wallet
      - key: POCKET_BILLS_TREASURY_ADDRESS
        sync: false                   # must exactly match the verified Circle Base SCA wallet
      - key: HOSTED_CHECKOUT_DAILY_USDC
        value: "500000"
      - key: VTPASS_MINIMUM_WALLET_BALANCE_NGN
        value: "5000"
      - key: POCKET_BILLS_STORE_KEY
        value: "hashpaylink:pocket-bills:v1"
      - key: CIRCLE_CLI_ENABLED
        value: "true"                 # required for reader wallet login, x402 balance checks, Gateway activation, and x402 pay
      - key: CIRCLE_GATEWAY_API_BASE_MAINNET
        value: "https://gateway-api.circle.com"
      - key: CIRCLE_GATEWAY_API_BASE_TESTNET
        value: "https://gateway-api-testnet.circle.com"
      - key: DATABASE_URL
        sync: false                   # Render Postgres for durable platform storage
      - key: HOSTED_CHECKOUT_SIGNING_SECRET
        sync: false                   # stable 32+ character HMAC secret; never rotate without a checkout migration
      - key: HOSTED_CHECKOUT_STORE_KEY
        value: "hashpaylink:hosted-checkouts:v2"
      - key: DEVELOPER_PORTAL_SECRET
        sync: false                   # stable 32+ character encryption and API-key digest secret
      - key: DEVELOPER_ADMIN_EMAILS
        sync: false                   # comma-separated Privy email allowlist for /admin/developers
      - key: DEVELOPER_ADMIN_USER_IDS
        sync: false                   # optional comma-separated Privy user-id allowlist
      - key: POCKET_SUPPORT_STORE_KEY
        value: "hashpaylink:pocket-support:v1"
      - key: POCKET_MONEY_LEDGER_STORE_KEY
        value: "hashpaylink:pocket-money-ledger:v1"
      - key: POCKET_MAX_UNRESOLVED_AGE_MS
        value: "900000"
      - key: POCKET_RECONCILIATION_INTERVAL_MS
        value: "60000"
      - key: POCKET_RECONCILIATION_BATCH_SIZE
        value: "100"
      - key: POCKET_RECONCILIATION_ALERT_COOLDOWN_MS
        value: "900000"
      - key: POCKET_RECONCILIATION_ALERT_STORE_KEY
        value: "hashpaylink:pocket-reconciliation-alerts:v1"
      - key: POCKET_OPERATIONS_ALERT_EMAIL
        sync: false                   # operations mailbox for stale payment alerts
      - key: DEVELOPER_PROJECT_STORE_KEY
        value: "hashpaylink:developer-projects:v1"
      - key: HASH_PAYLINK_BASE_URL
        value: "https://hashpaylink.com"
      - key: HASHPAYSTREAM_ARC_API_KEY
        sync: false                   # server-only Arc live project key; never expose with VITE_
      - key: HASHPAYSTREAM_ARC_PROJECT_ID
        sync: false                   # HashPayStream developer project receiving signed lifecycle events
      - key: HASHPAYSTREAM_ARC_WEBHOOK_SECRET
        sync: false                   # project-specific whsec_ signing secret
      - key: HASHPAYSTREAM_ARC_WEBHOOK_STORE_KEY_MAINNET
        value: "hashpaylink:arc-mainnet:5042:hashpaystream-webhooks:v1"
      - key: HASHPAYSTREAM_APP_OWNERSHIP_SECRET
        sync: false                   # stable 32+ character HMAC secret for standalone user ownership
      - key: HASHPAYSTREAM_APP_OWNERSHIP_STORE_KEY
        value: "hashpaystream:standalone-agreement-owners:v1"
      - key: HASHPAYSTREAM_HASH_PAYLINK_BASE_URL
        value: "https://app.hashpaylink.com"
      - key: PUBLIC_APP_URL
        value: "https://hashpaylink.com"
      - key: CREATOR_OFFICIAL_WALLET
        sync: false                   # official StreamPay creator wallet used for official cards
      - key: CREATOR_WORLD_CUP_NEWS_URL
        value: "https://www.fifa.com/en/tournaments/mens/worldcup/canadamexicousa2026"
      - key: CREATOR_WORLD_CUP_NEWS_PRICE_RAW
        value: "100000"
      - key: CREATOR_WORLD_CUP_SCORES_PRICE_RAW
        value: "100000"
      - key: X402_CREATOR_ACCEPT_NETWORKS
        value: "eip155:5042"
      - key: X402_CREATOR_FACILITATOR_URL
        value: "https://gateway-api.circle.com"
      - key: CREATOR_AGENT_X402_PAY_CHAIN
        value: "ARC"
      - key: AGENT_WALLET_SERVICE_SECRET
        sync: false                   # server secret for agent wallet service operations
      - key: DEFAULT_AGENT_SLUG
        value: "hashpaylink-agent"
      - key: DEFAULT_AGENT_WALLET_ADDRESS
        sync: false                   # optional pinned platform reader/agent wallet address
      - key: DEFAULT_AGENT_WALLET_CHAIN
        value: "BASE"
      - key: AGENT_WALLET_GATEWAY_BALANCE_CHAIN
        value: "MATIC"
      - key: AGENT_WALLET_GATEWAY_DEPOSIT_CHAIN
        value: "BASE"
      - key: AGENT_WALLET_MAX_GATEWAY_DEPOSIT_AMOUNT
        value: "5"
      - key: PRIVY_APP_ID
        sync: false                   # server-side Privy app id; can match VITE_PRIVY_APP_ID
      - key: PRIVY_APP_SECRET
        sync: false                   # server-side Privy secret for authenticated PolyDesk APIs
      - key: HASH_PAYLINK_POLYDESK_SERVICE_TOKEN
        sync: false                   # scoped server token for PolyDesk funding checkout creation
      - key: RESEND_API_KEY
        sync: false                   # Resend API key for Hash PayLink transactional emails
      - key: ALERT_FROM_EMAIL
        value: "no-reply@mail.hashpaylink.com"
      - key: ZEROSCOUT_API_URL
        value: "https://zeroscout.app"
      - key: ZEROSCOUT_INTEGRATION_SECRET
        sync: false                   # Server-only ZeroScout API key for LP operator signals
      - key: ZEROSCOUT_HASHWATCH_MEDIA_MODEL
        value: "Qwen/Qwen2.5-VL-72B-Instruct"
      - key: ZEROSCOUT_HASHWATCH_MEDIA_MODEL_CANDIDATES
        value: "Qwen/Qwen2.5-VL-72B-Instruct,qwen2.5-vl-72b-instruct,qwen-vl-max-latest,Qwen/Qwen2.5-Omni-7B"
      - key: ZEROSCOUT_HASHWATCH_MEDIA_PROVIDER
        value: "qwen-vl"
      - key: ZEROSCOUT_HASHWATCH_MEDIA_GUIDANCE_TIMEOUT_MS
        value: "90000"
      - key: OG_RPC_URL
        sync: false                   # Preferred private 0G EVM RPC endpoint; app falls back to public 0G RPC when unset
      - key: OG_INDEXER_RPC_URL
        sync: false                   # Preferred private 0G storage indexer endpoint; app falls back to public 0G indexer when unset
      - key: OG_MEMORY_COMMITMENT_SECRET
        sync: false                   # private HMAC key for non-reversible memory commitments; never expose with VITE_

      # ── V2 relayer (api/relay-v2.ts) ──────────────────────────────────────
      - key: PAYLINK_FACTORY_V2
        value: "0x2268B8aad138a550FEf46C621756fEb26b587F78"
      - key: CDP_PAYMASTER_URL
        sync: false                   # Coinbase/CDP paymaster URL for Base sponsorship
      - key: RELAYER_PRIVATE_KEY
        sync: false                   # 0x-prefixed — ROTATE before adding here
      - key: PRIVATE_RPC_URL
        sync: false                   # Alchemy backend RPC key (high rate limit)
      - key: RELAYER_PRIVATE_KEY_ARC_MAINNET
        sync: false                   # server-side Arc relayer key; never expose with VITE_
      - key: PRIVATE_RPC_URL_ARC_MAINNET
        value: "https://rpc.mainnet.arc.io"

      # ── Arbitrum + native USDC relayer (api/relay-arbitrum-usdc.ts + api/relay-v2.ts) ─
      - key: RELAYER_PRIVATE_KEY_ARB
        sync: false                   # Arbitrum relayer key — wallet needs ETH on Arbitrum
      - key: PRIVATE_RPC_URL_ARB
        value: "https://arb1.arbitrum.io/rpc"   # swap for Alchemy/QuickNode in prod
      - key: PAYLINK_FACTORY_V2_ARB
        value: "0x2268B8aad138a550FEf46C621756fEb26b587F78"

      # Operational endpoint authentication and historical payment indexing
      - key: ADMIN_SECRET
        sync: false                   # Authorization Bearer credential, at least 24 characters
      - key: FACTORY_FROM_BLOCK
        value: "45786000"             # Base block before the 0.2% router factory deployment
      - key: SOLANA_RPC_URL
        sync: false                   # Solana backend private RPC endpoint
      - key: RELAYER_PRIVATE_KEY_SOLANA
        sync: false                   # Solana relayer keypair; wallet needs SOL for sponsored payments
      - key: SOLANA_TREASURY
        sync: false                   # Solana treasury wallet address for fee collection
      - key: POLYMARKET_BUILDER_CODE
        sync: false                   # Polymarket builder code for bridge calls and future CLOB order attribution
      - key: POLYMARKET_BUILDER_API_KEY
        sync: false                   # Builder API key from Polymarket Builders dashboard
      - key: POLYMARKET_BUILDER_SECRET
        sync: false                   # Builder API secret from Polymarket Builders dashboard
      - key: POLYMARKET_BUILDER_PASSPHRASE
        sync: false                   # Builder API passphrase from Polymarket Builders dashboard

      # Dedicated Pocket cryptographic secrets; never substitute provider credentials.
      - key: POCKET_PIN_PEPPER
        sync: false                   # preserve existing value to keep PIN hashes valid
      - key: POCKET_SWAP_QUOTE_SECRET
        sync: false                   # at least 32 characters; signs Arc/XStocks quotes
